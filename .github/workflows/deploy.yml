name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    env:
      USE_DETERMINISTIC_INFERENCE: "true"
      USE_MOCKED_MODELS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install .
          pip install .[dev]

      - name: Run invariant tests
        run: python -m pytest tests/ -v

  coverage:
    runs-on: ubuntu-latest
    needs: verify-invariants
    env:
      USE_DETERMINISTIC_INFERENCE: "true"
      USE_MOCKED_MODELS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install .
          pip install .[dev]
          pip install pytest-cov

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=45

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
