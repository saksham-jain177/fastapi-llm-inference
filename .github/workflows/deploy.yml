name: CI/CD Pipeline

# EXPLANATION: This tells GitHub Actions when to run this workflow
# - "push" to "main" branch means every time you push code to main
# - "pull_request" means when someone creates a PR targeting main
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# EXPLANATION: Environment variables available to ALL jobs in this workflow
# Using GHCR (GitHub Container Registry) which is ghcr.io
env:
  REGISTRY: ghcr.io
  # This creates an image name like: ghcr.io/yourusername/fastapi-llm-inference
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB 1: Verify Invariants
  verify:
    name: Verify invariants (hardware-independent)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system .
          uv pip install --system ".[dev]"

      - name: Run Unit & Gate Tests (Hardware-Independent)
        env:
          USE_DETERMINISTIC_INFERENCE: "true"
        run: |
          # 1. Epistemic Gate Verification
          pytest tests/test_epistemic_gate.py -v
          # 2. Metrics Invariant Contract
          pytest tests/test_metrics.py -v
          # 3. Legacy Logic Tests
          pytest app/tests/test_routing_logic.py -v
          pytest app/tests/test_health.py -v

  # JOB 2: Build and Push Docker Image
  package:
    name: Build container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # JOB 3: Deploy to Render
  deploy:
    name: Deploy to target environment
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
