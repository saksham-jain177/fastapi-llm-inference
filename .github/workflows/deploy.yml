name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  verify-invariants:
    runs-on: ubuntu-latest

    env:
      USE_DETERMINISTIC_INFERENCE: "true"
      USE_MOCKED_MODELS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip sync uv.lock

      - name: Run tests
        run: pytest tests/ -v
