name: CI/CD Pipeline

# EXPLANATION: This tells GitHub Actions when to run this workflow
# - "push" to "main" branch means every time you push code to main
# - "pull_request" means when someone creates a PR targeting main
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# EXPLANATION: Environment variables available to ALL jobs in this workflow
# Using GHCR (GitHub Container Registry) which is ghcr.io
env:
  REGISTRY: ghcr.io
  # This creates an image name like: ghcr.io/yourusername/fastapi-llm-inference
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB 1: Run Tests
  # EXPLANATION: This job checks that our code works before building/deploying
  test:
    runs-on: ubuntu-latest

    steps:
      # EXPLANATION: Checkout = download your code from GitHub to the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # EXPLANATION: Install Python so we can run our tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # EXPLANATION: Install uv for deterministic dependency management
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # EXPLANATION: Sync dependencies from the authoritative uv.lock
      - name: Install dependencies
        run: |
          uv pip install --system .
          uv pip install --system ".[dev]"

      # EXPLANATION: Run pytest in MOCKED mode - if ANY test fails, the workflow stops here
      - name: Run Unit & Gate Tests (Mocked)
        env:
          USE_MOCKED_MODELS: "true"
        run: |
          # 1. New Epistemic Gate Verification
          pytest tests/test_epistemic_gate.py -v
          # 2. Metrics Invariant Contract
          pytest tests/test_metrics.py -v
          # 3. Legacy Logic Tests
          pytest app/tests/test_routing_logic.py -v
          pytest app/tests/test_health.py -v

  # JOB 2: Build and Push Docker Image
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      # EXPLANATION: Build the Docker image from ROOT context
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # JOB 3: Deploy to Render
  # EXPLANATION: This triggers Render to pull the new Docker image and redeploy
  # "needs: build-and-push" means this only runs after image is successfully pushed
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # EXPLANATION: Render provides a "Deploy Hook" URL
      # When we make an HTTP request to this URL, Render automatically:
      # 1. Pulls the latest image from GHCR
      # 2. Stops the old container
      # 3. Starts a new container with the new image
      - name: Trigger Render deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
