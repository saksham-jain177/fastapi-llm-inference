[project]
name = "fastapi-llm-inference"
version = "0.0.0"
description = "Production LLM inference with 4-bit quantization, RAG, and epistemic gating"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Saksham Jain" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scipy",
    "tavily-python",
    "sentence-transformers",
    "sse-starlette",
    "prometheus-client>=0.16.0",
    "redis>=5.0.0",
    "chromadb>=0.4.0",
    "httpx>=0.24.1",
    "transformers>=4.31.0",
    "accelerate>=0.21.0",
    "torch",
    "bitsandbytes",
    "motor>=3.3.0",
    "dnspython",
    "duckduckgo-search>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.setuptools]
packages = []
